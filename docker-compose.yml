services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: studyroom
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Define LOCAL_DATABASE_PASSWORD in your local .env}
    ports:
      - '127.0.0.1:54322:5432'
    volumes:
      - studyroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyroom -d studyroom']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  studyroom-postgres:
