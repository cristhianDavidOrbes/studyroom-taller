services:
  - type: web
    name: studyroom-sut-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build -w @studyroom/api
    startCommand: npm run start -w @studyroom/api
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: studyroom-sut-2026
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WEB_ORIGIN
        value: https://studyroom-sut.onrender.com
      - key: SUPABASE_URL
        value: https://wyjngkxhylcczjoqalhj.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: studyroom-files
      - key: LIVEKIT_URL
        value: wss://studyroom-gx04qgse.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AI_GATEWAY_URL
        sync: false
      - key: AI_GATEWAY_TOKEN
        sync: false
  - type: web
    name: studyroom-sut
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @studyroom/web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_URL
        value: https://studyroom-sut-api.onrender.com/api
      - key: VITE_USE_FIREBASE_EMULATOR
        value: 'false'
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: studyroom-sut-2026.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: studyroom-sut-2026
      - key: VITE_FIREBASE_APP_ID
        value: 1:137488707763:web:cace19bbced0a41c4e40c6
